<!doctype html>
<html><head><meta charset="utf-8">
<style>
  :root{--ink:#14171c;--ink2:#4b5260;--blue:#2a78d6;--green:#1baf7a;--amber:#d68f00;--orange:#eb6834;--pink:#d35d91;--violet:#6250d6}
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:1600px;background:#fff;font-family:Inter,"DejaVu Sans",sans-serif;color:var(--ink);padding:16px 18px}
  .m{font-family:"Latin Modern Math","DejaVu Serif",serif;font-style:italic;font-size:1.08em}
  svg text{font-family:Inter,"DejaVu Sans",sans-serif}
</style></head><body>
<svg width="1564" height="560" viewBox="0 0 1564 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
    <marker id="ahv" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6250d6"/></marker>
    <marker id="ahg" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1baf7a"/></marker>
  </defs>
  <style>
    .box{fill:#fff;stroke-width:1.8;rx:10}
    .t{font-size:15px;font-weight:700;fill:#14171c}
    .s{font-size:12.5px;fill:#4b5260}
    .sh{font-size:12px;fill:#6250d6;font-weight:600}
    .ln{stroke:#6b7280;stroke-width:2;fill:none;marker-end:url(#ah)}
    .lv{stroke:#6250d6;stroke-width:2;fill:none;marker-end:url(#ahv);stroke-dasharray:6 4}
    .lg{stroke:#1baf7a;stroke-width:2;fill:none;marker-end:url(#ahg)}
    .mi{font-family:"Latin Modern Math","DejaVu Serif",serif;font-style:italic}
  </style>

  <!-- ===== Input channels ===== -->
  <text x="10" y="22" class="t">Window of <tspan class="mi">C</tspan> channels (30 Hz, 5 s)</text>
  <g transform="translate(10,40)">
    <rect width="190" height="250" rx="10" fill="#f6f8fb" stroke="#c9ced6" stroke-width="1.5"/>
    <g fill="none" stroke-width="1.6">
      <path d="M12,35 C30,15 45,55 62,30 S95,45 112,25 S150,50 178,30" stroke="#2a78d6"/>
      <path d="M12,85 C28,70 48,100 66,80 S100,95 118,75 S150,95 178,80" stroke="#2a78d6"/>
      <path d="M12,135 C30,125 45,145 60,128 S95,150 115,130 S150,140 178,128" stroke="#2a78d6"/>
      <path d="M12,185 C25,170 50,200 70,180 S100,195 120,175 S155,195 178,180" stroke="#eb6834"/>
    </g>
    <text x="95" y="222" text-anchor="middle" class="s">⋮  3 ≤ <tspan class="mi">C</tspan> ≤ 54 channels</text>
    <text x="95" y="240" text-anchor="middle" class="s"><tspan class="mi">x̃</tspan><tspan font-size="10" dy="3" class="mi">c</tspan><tspan dy="-3"> ∈ ℝ</tspan><tspan font-size="10" dy="-6">150</tspan></text>
  </g>

  <!-- channel text -->
  <g transform="translate(10,330)">
    <rect width="190" height="120" rx="10" fill="#f4f2fd" stroke="#b9b0ef" stroke-width="1.5"/>
    <text x="12" y="24" class="t" style="font-size:14px">Channel text τ<tspan font-size="10" dy="3" class="mi">r</tspan><tspan dy="-3">(</tspan><tspan class="mi">c</tspan>)</text>
    <text x="12" y="48" class="s">“accelerometer</text>
    <text x="12" y="65" class="s"> x-axis, chest, m/s²”</text>
    <text x="12" y="90" class="s">M0: “IMU channel”</text>
    <text x="12" y="107" class="s">M1: “accelerometer x-axis”</text>
  </g>

  <!-- ===== Conv stem ===== -->
  <path class="ln" d="M202,165 L238,165"/>
  <g transform="translate(242,60)">
    <rect width="200" height="210" rx="10" fill="#fff" stroke="#2a78d6" stroke-width="1.8"/>
    <text x="100" y="26" text-anchor="middle" class="t">Shared conv stem</text>
    <text x="100" y="44" text-anchor="middle" class="s">(applied per channel)</text>
    <rect x="10" y="58" width="180" height="34" rx="6" fill="#eef4fc" stroke="#a9c8ee"/>
    <text x="100" y="80" text-anchor="middle" class="s" style="font-size:11.5px">Conv1d 1→64, k7, s2 · GELU</text>
    <rect x="10" y="100" width="180" height="34" rx="6" fill="#eef4fc" stroke="#a9c8ee"/>
    <text x="100" y="122" text-anchor="middle" class="s" style="font-size:11.5px">Conv1d 64→128, k5, s2 · GELU</text>
    <rect x="10" y="142" width="180" height="34" rx="6" fill="#eef4fc" stroke="#a9c8ee"/>
    <text x="100" y="164" text-anchor="middle" class="s">AdaptiveAvgPool → 10</text>
    <text x="100" y="198" text-anchor="middle" class="sh" style="fill:#2a78d6">10 tokens × 128 per channel</text>
  </g>

  <!-- text encoder -->
  <path class="lv" d="M202,390 L238,390"/>
  <g transform="translate(242,345)">
    <rect width="200" height="92" rx="10" fill="#fff" stroke="#6250d6" stroke-width="1.8"/>
    <text x="100" y="26" text-anchor="middle" class="t">Frozen text encoder <tspan class="mi">E</tspan><tspan font-size="10" dy="3" class="mi">T</tspan></text>
    <text x="100" y="47" text-anchor="middle" class="s">all-mpnet-base-v2</text>
    <text x="100" y="72" text-anchor="middle" class="sh"><tspan class="mi">e</tspan><tspan class="mi" font-size="10" dy="3">c</tspan><tspan dy="-3"> ∈ ℝ</tspan><tspan font-size="9" dy="-6">768</tspan></text>
  </g>

  <!-- ===== Token assembly ===== -->
  <path class="ln" d="M444,165 L490,165"/>
  <path class="lv" d="M444,390 L470,390 L470,225 L548,225 L548,206"/>
  <g transform="translate(494,95)">
    <circle cx="54" cy="70" r="24" fill="#fff" stroke="#14171c" stroke-width="1.8"/>
    <text x="54" y="79" text-anchor="middle" style="font-size:26px;font-weight:700">+</text>
    <text x="54" y="22" text-anchor="middle" class="s">positional <tspan class="mi">P</tspan><tspan class="mi" font-size="10" dy="3">t</tspan></text>
    <path class="ln" d="M54,28 L54,44"/>

  </g>
  <text x="478" y="262" class="sh"><tspan class="mi">W</tspan><tspan class="mi" font-size="10" dy="3">e</tspan><tspan class="mi" dy="-3"> e</tspan><tspan class="mi" font-size="10" dy="3">c</tspan></text>
  <text x="478" y="279" class="s" style="font-size:11.5px">768→128</text>
  <text x="478" y="296" class="s" style="font-size:11.5px">Eq. (13)</text>

  <!-- token sequence -->
  <path class="ln" d="M574,165 L612,165"/>
  <g transform="translate(616,70)">
    <rect width="210" height="200" rx="10" fill="#fbfbfc" stroke="#c9ced6" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="105" y="24" text-anchor="middle" class="t" style="font-size:14px">Token set <tspan class="mi">H</tspan> ∈ ℝ<tspan font-size="10" dy="-6">10C × 128</tspan></text>
    <g transform="translate(16,40)">
      <g fill="#2a78d6" opacity=".85"><rect x="0" y="0" width="14" height="26" rx="2"/><rect x="18" y="0" width="14" height="26" rx="2"/><rect x="36" y="0" width="14" height="26" rx="2"/><rect x="54" y="0" width="14" height="26" rx="2"/></g>
      <text x="80" y="18" class="s">channel 1</text>
      <g fill="#2a78d6" opacity=".6" transform="translate(0,36)"><rect x="0" y="0" width="14" height="26" rx="2"/><rect x="18" y="0" width="14" height="26" rx="2"/><rect x="36" y="0" width="14" height="26" rx="2"/><rect x="54" y="0" width="14" height="26" rx="2"/></g>
      <text x="80" y="54" class="s">channel 2</text>
      <text x="30" y="90" class="s">⋮</text>
      <g fill="#eb6834" opacity=".8" transform="translate(0,98)"><rect x="0" y="0" width="14" height="26" rx="2"/><rect x="18" y="0" width="14" height="26" rx="2"/><rect x="36" y="0" width="14" height="26" rx="2"/><rect x="54" y="0" width="14" height="26" rx="2"/></g>
      <text x="80" y="116" class="s">channel <tspan class="mi">C</tspan></text>
      <g fill="#d6d9de" transform="translate(0,132)"><rect x="0" y="0" width="14" height="20" rx="2"/><rect x="18" y="0" width="14" height="20" rx="2"/><rect x="36" y="0" width="14" height="20" rx="2"/></g>
      <text x="80" y="146" class="s">padding (masked)</text>
    </g>
  </g>

  <!-- transformer -->
  <path class="ln" d="M828,165 L866,165"/>
  <g transform="translate(870,50)">
    <rect width="220" height="240" rx="10" fill="#fff" stroke="#1baf7a" stroke-width="1.8"/>
    <text x="110" y="26" text-anchor="middle" class="t">Transformer encoder</text>
    <text x="110" y="44" text-anchor="middle" class="s">pre-norm, × 3 layers</text>
    <rect x="8" y="58" width="204" height="62" rx="7" fill="#e9f7f1" stroke="#9fdcc4"/>
    <text x="110" y="82" text-anchor="middle" class="s" style="font-size:11.5px">LayerNorm → Multi-head</text>
    <text x="110" y="100" text-anchor="middle" class="s" style="font-size:11.5px">self-attention (4 heads) + res.</text>
    <rect x="8" y="130" width="204" height="62" rx="7" fill="#e9f7f1" stroke="#9fdcc4"/>
    <text x="110" y="154" text-anchor="middle" class="s" style="font-size:11.5px">LayerNorm → FFN 128→256→128</text>
    <text x="110" y="172" text-anchor="middle" class="s" style="font-size:11.5px">ReLU, dropout 0.1 + res.</text>
    <text x="110" y="220" text-anchor="middle" class="sh" style="fill:#1baf7a">key-padding mask over channels</text>
  </g>

  <!-- pooling & projection -->
  <path class="ln" d="M1092,165 L1128,165"/>
  <g transform="translate(1132,70)">
    <rect width="190" height="200" rx="10" fill="#fff" stroke="#eb6834" stroke-width="1.8"/>
    <text x="95" y="26" text-anchor="middle" class="t">Readout</text>
    <rect x="18" y="42" width="154" height="34" rx="6" fill="#fdf0ea" stroke="#f3bea6"/>
    <text x="95" y="64" text-anchor="middle" class="s">masked mean pooling</text>
    <rect x="18" y="86" width="154" height="34" rx="6" fill="#fdf0ea" stroke="#f3bea6"/>
    <text x="95" y="108" text-anchor="middle" class="s">Linear 128 → 768</text>
    <rect x="18" y="130" width="154" height="34" rx="6" fill="#fdf0ea" stroke="#f3bea6"/>
    <text x="95" y="152" text-anchor="middle" class="s">ℓ2 normalisation</text>
    <text x="95" y="188" text-anchor="middle" class="sh" style="fill:#eb6834"><tspan class="mi">z</tspan> ∈ 𝕊<tspan font-size="9" dy="-6">767</tspan><tspan dy="6">  (Eq. 14)</tspan></text>
  </g>

  <!-- similarity head -->
  <path class="ln" d="M1324,165 L1360,165"/>
  <g transform="translate(1364,60)">
    <rect width="192" height="220" rx="10" fill="#fff" stroke="#14171c" stroke-width="1.8"/>
    <text x="96" y="26" text-anchor="middle" class="t">Prototype head</text>
    <text x="96" y="52" text-anchor="middle" class="s">cos(<tspan class="mi">z</tspan>, <tspan class="mi">p</tspan><tspan class="mi" font-size="10" dy="3">k</tspan><tspan dy="-3">) / </tspan><tspan class="mi">T</tspan></text>
    <text x="96" y="70" text-anchor="middle" class="s">learned temperature <tspan class="mi">T</tspan></text>
    <g transform="translate(26,84)">
      <rect x="0" y="40" width="18" height="40" fill="#2a78d6" rx="2"/><rect x="24" y="12" width="18" height="68" fill="#2a78d6" rx="2"/>
      <rect x="48" y="55" width="18" height="25" fill="#2a78d6" rx="2"/><rect x="72" y="62" width="18" height="18" fill="#2a78d6" rx="2"/>
      <rect x="96" y="48" width="18" height="32" fill="#2a78d6" rx="2"/><rect x="120" y="66" width="18" height="14" fill="#2a78d6" rx="2"/>
      <line x1="-4" y1="80" x2="144" y2="80" stroke="#6b7280"/>
    </g>
    <text x="96" y="186" text-anchor="middle" class="s">softmax over classes</text>
    <text x="96" y="204" text-anchor="middle" class="sh" style="fill:#14171c">(Eq. 15–16)</text>
  </g>

  <!-- prototypes path -->
  <g transform="translate(1100,350)">
    <rect width="300" height="100" rx="10" fill="#f4f2fd" stroke="#b9b0ef" stroke-width="1.5"/>
    <text x="14" y="26" class="t" style="font-size:14px">Label prototypes <tspan class="mi">p</tspan><tspan class="mi" font-size="10" dy="3">k</tspan><tspan dy="-3"> = </tspan><tspan class="mi">E</tspan><tspan class="mi" font-size="10" dy="3">T</tspan><tspan dy="-3">(</tspan><tspan class="mi">y</tspan><tspan class="mi" font-size="10" dy="3">k</tspan><tspan dy="-3">)</tspan></text>
    <text x="14" y="50" class="s">training: canonical class texts (≤ 33 classes)</text>
    <text x="14" y="70" class="s">zero-shot test: held-out raw label names</text>
    <text x="14" y="90" class="s">E4 label defect: text of another class</text>
  </g>
  <path class="lv" d="M444,420 L1090,420" style="stroke-dasharray:6 4"/>
  <text x="760" y="412" text-anchor="middle" class="s" style="fill:#6250d6">same frozen encoder <tspan class="mi">E</tspan><tspan class="mi" font-size="10" dy="3">T</tspan></text>
  <path class="lv" d="M1400,400 L1460,400 L1460,286"/>

  <!-- few-shot -->
  <g transform="translate(870,470)">
    <rect width="686" height="70" rx="10" fill="#fbfbfc" stroke="#c9ced6" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="16" y="28" class="t" style="font-size:14px">Few-shot adaptation</text>
    <text x="16" y="52" class="s">frozen <tspan class="mi">z</tspan> → logistic regression on 1 % or 10 % of held-out windows per class; tested on the rest</text>
  </g>
  <path class="lg" d="M1227,272 L1227,318 L1050,318 L1050,465"/>

  <!-- stats -->
  <g transform="translate(10,470)">
    <rect width="840" height="70" rx="10" fill="#fff" stroke="#e4c3b3" stroke-width="1.5"/>
    <text x="16" y="28" class="t" style="font-size:14px">0.64 M trainable parameters</text>
    <text x="16" y="52" class="s">AdamW (lr 10⁻³, wd 10⁻²), one-cycle schedule, batch 256, 25 epochs, gradient clip 1.0; channel-agnostic: one model serves 3–54 channels</text>
  </g>
</svg>
</body></html>
